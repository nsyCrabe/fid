<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mes Cartes de Fidélité</title>
<meta name="theme-color" content="#1a1a2e" id="themeColorMeta">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="midnight">

<header>
  <div class="header-left">
    <h1>💳 Mes Cartes</h1>
    <div class="sub" id="cardCount">0 carte enregistrée</div>
  </div>
  <button id="themeBtn" class="icon-btn" title="Changer de thème">🎨</button>
</header>

<div id="searchBar">
  <input type="text" id="searchInput" placeholder="Rechercher une enseigne...">
</div>

<div id="cardsGrid"></div>
<div id="emptyState" style="display:none;">
  <div class="big">🪪</div>
  <div>Aucune carte pour l'instant.<br>Appuie sur + pour en ajouter une.</div>
</div>

<button id="fab">+</button>

<!-- Modal ajout/édition -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nouvelle carte</h2>

    <div class="field">
      <label>Image / logo de la carte</label>
      <div class="image-picker" id="imagePicker">
        <div class="image-preview" id="imagePreview">
          <span id="imagePlaceholder">📷 Ajouter une image</span>
        </div>
        <input type="file" id="imageInput" accept="image/*" hidden>
      </div>
      <button class="btn-mini" id="removeImageBtn" style="display:none;">Retirer l'image</button>
    </div>

    <div class="field">
      <label>Nom de l'enseigne</label>
      <input type="text" id="inputName" placeholder="Ex: Carrefour, Auchan...">
    </div>
    <div class="field">
      <label>Type de code</label>
      <select id="inputCodeType">
        <option value="barcode">Code-barres (numéro de carte)</option>
        <option value="qrcode">QR Code</option>
        <option value="none">Aucun code (juste un numéro)</option>
      </select>
    </div>
    <div class="field">
      <label>Numéro de carte / code</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="inputCode" placeholder="Scanner ou saisir le numéro" style="flex:1;">
        <button class="btn btn-secondary" id="scanBtn" style="flex:0 0 auto; padding:12px 16px;">📷</button>
      </div>
    </div>
    <div class="field">
      <label>Couleur (si pas d'image)</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="cancelBtn">Annuler</button>
      <button class="btn btn-primary" id="saveBtn">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Sélecteur de thème -->
<div class="modal-overlay" id="themeOverlay">
  <div class="modal">
    <h2>Choisir un thème</h2>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="closeThemeBtn">Fermer</button>
    </div>
  </div>
</div>

<!-- Détail carte -->
<div class="detail-overlay" id="detailOverlay">
  <button class="detail-close" id="detailClose">←</button>
  <div class="detail-actions">
    <button id="detailEdit">✏️</button>
    <button id="detailDelete">🗑️</button>
  </div>
  <div class="detail-card" id="detailCard">
    <div class="detail-banner" id="detailBanner"></div>
    <div class="name" id="detailName"></div>
    <div class="type" id="detailType"></div>
    <canvas id="barcodeCanvas"></canvas>
    <div id="qrHolder"></div>
    <div class="code-text" id="detailCodeText"></div>
  </div>
</div>

<!-- Scanner caméra -->
<div class="scan-overlay" id="scanOverlay">
  <div class="scan-header">
    <button id="scanClose" class="text-btn">✕ Fermer</button>
    <span>Scanner un code</span>
  </div>
  <video id="scanVideo" autoplay playsinline muted></video>
  <div class="scan-hint" id="scanHint">Vise le code-barres ou QR code de ta carte</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.error);
}
</script>
</body>
</html>
